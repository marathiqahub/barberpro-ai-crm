<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141414"><title>BarberPro — Live queue</title><link rel="stylesheet" href="/palette.css"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#141414;color:#f7f4ee;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:clamp(20px,4vw,56px)}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff22;padding-bottom:24px}.brand{font-weight:800;letter-spacing:.08em;color:#c9a227}.status{font-size:12px;color:#c9a227;letter-spacing:.15em}.shop{font-size:clamp(30px,5vw,64px);margin:30px 0 6px}.label{color:#a7aaa6;letter-spacing:.15em;font-size:13px;text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:38px}.panel{background:#202520;border:1px solid #ffffff18;border-radius:18px;padding:clamp(20px,3vw,36px);min-height:260px}.panel h2{font-size:15px;letter-spacing:.15em;color:#c9a227;text-transform:uppercase;margin:0 0 24px}.person{font-size:clamp(30px,4vw,48px);font-weight:750}.detail{color:#a7aaa6;margin-top:10px}.next{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #ffffff18;padding:14px 0}.next:last-child{border:0}.empty{color:#a7aaa6;font-size:20px}.foot{color:#7d867f;margin-top:32px;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.panel{min-height:180px}}
</style></head><body><main class="wrap"><header><div class="brand">✂ BARBERPRO</div><div class="status">● LIVE QUEUE</div></header><h1 id="shop" class="shop">Live queue</h1><div id="label" class="label">Now serving and next up</div><section class="grid"><article class="panel"><h2>Now serving</h2><div id="current" class="empty">Waiting for the next customer…</div></article><article class="panel"><h2>Next up</h2><div id="next" class="empty">No one is waiting.</div></article></section><p id="updated" class="foot">Connecting to shop queue…</p></main><script src="/queue.js" defer></script></body></html>
