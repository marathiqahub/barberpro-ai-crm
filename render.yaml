databases:
  - name: barberpro-ai-crm-db
    region: singapore
    plan: free
    databaseName: barberpro
    user: barberpro
    postgresMajorVersion: "17"

services:
  - type: web
    name: barberpro-ai-crm
    runtime: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:render
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: barberpro-ai-crm-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: barberpro-ai-crm
      - key: JWT_AUDIENCE
        value: barberpro-api
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
