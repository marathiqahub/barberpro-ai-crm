databases:
  - name: barberpro-ai-crm-db
    region: singapore
    plan: free
    databaseName: barberpro
    user: barberpro
    postgresMajorVersion: "17"

services:
  - type: web
    name: barberpro-ai-crm
    runtime: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:render
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: barberpro-ai-crm-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: barberpro-ai-crm
      - key: JWT_AUDIENCE
        value: barberpro-api
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_SUBSCRIPTION_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: TWILIO_SMS_DLT_ENTITY_ID
        sync: false
      - key: TWILIO_SMS_DLT_TEMPLATE_ID
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: META_WHATSAPP_TOKEN
        sync: false
      - key: META_WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: PRIVATE_MEDIA_HOSTS
        sync: false
  - type: cron
    name: barberpro-reminder-delivery
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run reminders:deliver
    schedule: "* * * * *"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: barberpro-ai-crm-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: META_WHATSAPP_TOKEN
        sync: false
