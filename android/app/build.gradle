plugins { id 'com.android.application' }
android {
    namespace 'ai.barberpro.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.barberpro.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'BARBERPRO_BASE_URL', '"https://YOUR-BARBERPRO-DOMAIN"'
    }
    buildFeatures { buildConfig true }
}
