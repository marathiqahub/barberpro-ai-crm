name: CI

on:
  push:
    branches: [main, feat/auth-jwt-refresh, test/postgres-auth-integration]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: barberpro
          POSTGRES_PASSWORD: barberpro
          POSTGRES_DB: barberpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barberpro -d barberpro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://barberpro:barberpro@localhost:5432/barberpro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
