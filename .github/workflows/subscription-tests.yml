name: Subscription database integration
on:
  pull_request:
    paths:
      - 'src/routes/subscriptionRoutes.js'
      - 'src/auth/**'
      - 'db/migrations/**'
      - 'test/subscription-lifecycle.integration.test.js'
      - '.github/workflows/subscription-tests.yml'
  push:
    branches: [main]
jobs:
  subscription-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: barberpro
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: barberpro_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U barberpro -d barberpro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply schema to disposable PostgreSQL
        env:
          DATABASE_URL: postgres://barberpro:test-password@localhost:5432/barberpro_test
        run: npm run db:migrate
      - name: Run database-backed subscription tests
        env:
          TEST_DATABASE_URL: postgres://barberpro:test-password@localhost:5432/barberpro_test
        run: node --test test/subscription-lifecycle.integration.test.js
