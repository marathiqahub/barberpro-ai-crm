services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barberpro}
      POSTGRES_USER: ${POSTGRES_USER:-barberpro}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0

  api:
    build: .
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-barberpro}
      PGUSER: ${POSTGRES_USER:-barberpro}
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_ACCESS_SECRET_FILE: /run/secrets/jwt_access_secret
      JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
      JWT_ISSUER: ${JWT_ISSUER:-barberpro-ai-crm}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-barberpro-api}
    secrets:
      - db_password
      - jwt_access_secret
      - jwt_refresh_secret
    ports:
      - "${PORT_BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0

volumes:
  postgres_data:

secrets:
  db_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/db_password.txt}
  jwt_access_secret:
    file: ${JWT_ACCESS_SECRET_FILE:-./secrets/jwt_access_secret.txt}
  jwt_refresh_secret:
    file: ${JWT_REFRESH_SECRET_FILE:-./secrets/jwt_refresh_secret.txt}
